<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/images/logos/logo-128x128.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Match React preferences before the first paint, even when module downloads are slow.
      ;(() => {
        const root = document.documentElement
        let language = 'en'
        let theme = window.matchMedia?.('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        try {
          language = localStorage.getItem('language') === 'vi' ? 'vi' : 'en'
          const savedTheme = localStorage.getItem('loopy_theme')
          if (savedTheme === 'light' || savedTheme === 'dark') theme = savedTheme
        } catch {
          // Storage is optional; English and the system theme remain usable.
        }
        root.lang = language
        root.dataset.theme = theme
        root.style.colorScheme = theme
      })()
    </script>
    <link rel="stylesheet" href="/src/index.css" />

    <!-- Primary Meta Tags -->
    <title>Loopy - Interactive Multi-Language Coding Playground</title>
    <meta name="title" content="Loopy - Interactive Multi-Language Coding Playground" />
    <meta
      name="description"
      content="Learn programming step by step, practice with real code, and follow a guided learning path."
    />
    <meta
      name="keywords"
      content="learn programming, coding playground, JavaScript, Python, C++, code editor, guided learning"
    />
    <meta name="author" content="Loopy Team" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://loopy.dev/" />
    <meta property="og:title" content="Loopy - Interactive Multi-Language Coding Playground" />
    <meta
      property="og:description"
      content="Learn programming step by step, practice with real code, and follow a guided learning path."
    />
    <meta property="og:image" content="https://loopy.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:site_name" content="Loopy" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://loopy.dev/" />
    <meta property="twitter:title" content="Loopy - Interactive Multi-Language Coding Playground" />
    <meta
      property="twitter:description"
      content="Learn programming step by step, practice with real code, and follow a guided learning path."
    />
    <meta property="twitter:image" content="https://loopy.dev/twitter-image.png" />

    <!-- Additional Meta Tags -->
    <meta name="theme-color" content="#0B0F19" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Loopy" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://loopy.dev/" />

    <!-- Preconnect for Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"><!-- app-loading --></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
