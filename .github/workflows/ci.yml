name: Frontend CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  build-lint-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run lint
        run: yarn lint:strict

      - name: Audit runtime and development dependencies
        run: yarn audit --json

      - name: Run build
        run: yarn build
        env:
          VITE_API_URL: http://localhost:3000

      - name: Run tests
        run: yarn test

      - name: Typecheck tests
        run: yarn test:types

      - name: Install test browser
        run: yarn playwright install --with-deps chromium

      - name: Verify compiled frontend with API fixtures
        run: yarn test:production

      - name: Verify learner flows with mocked APIs
        run: yarn test:e2e
